    <!-- 1. Fix relative assets resolution on GitHub Pages when URL lacks trailing slash -->
    <script>
      (function() {
        var p = window.location.pathname;
        if (p && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
          window.location.replace(window.location.origin + p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>

    <!-- 2. Auto-redirect to /docs/ if user deployed raw repo root to GitHub Pages instead of built folder -->
    <script>
      (function() {
        // Runs only when uncompiled source script exists
        if (document.querySelector('script[src*="/src/main.tsx"]')) {
          var h = window.location.hostname;
          var p = window.location.pathname;
          if (h && h.indexOf('github.io') !== -1 && p.indexOf('/docs') === -1) {
            var clean = p.replace(/\/+$/, '');
            window.location.replace(window.location.origin + clean + '/docs/' + window.location.search + window.location.hash);
          }
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- MediaPipe CDN (deferred to prevent blocking DOM load) -->
    <script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <body class="bg-slate-950 text-white selection:bg-rose-500 selection:text-white overflow-x-hidden font-['Plus_Jakarta_Sans',sans-serif]">

      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
